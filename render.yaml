services:
  - type: pserv
    name: pos-db
    plan: free
    envVars:
      - key: POSTGRES_USER
        value: postgres
      - key: POSTGRES_PASSWORD
        value: postgres
      - key: POSTGRES_DB
        value: pos-db

  - type: docker
    name: pos-api
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: DATABASE_URL
        value: postgres://postgres:postgres@pos-db:5432/pos-db
